<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>MBS Daily Segment Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@300;400;600;700&display=swap');
:root{--bg:#080c14;--surface:#0d1422;--border:#162032;--border2:#1e2e45;--text:#e2e8f0;--muted:#4a5e78;--muted2:#2a3d55;--april:#f59e0b;--may:#3b82f6;--june:#10b981}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 24px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:baseline;gap:10px}
.logo h1{font-size:18px;font-weight:700;color:#f8fafc;letter-spacing:-.4px}
.logo span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.last-update{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
/* Tab rows */
.tab-row{display:flex;gap:6px;margin-bottom:10px}
.tab-pill{font-family:'JetBrains Mono',monospace;font-size:11px;padding:6px 16px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;letter-spacing:.5px}
.tab-pill:hover{color:var(--text);border-color:#3b82f6}
.tab-pill.active{font-weight:700;border-color:transparent}
/* merchant colors */
.tab-pill[data-m="MBS"].active{background:#1a1a3a;color:#a78bfa;border-color:#7c3aed}
.tab-pill[data-m="Grab"].active{background:#1a2e1a;color:#4ade80;border-color:#16a34a}
.tab-pill[data-m="GSM"].active{background:#1a2e2a;color:#2dd4bf;border-color:#0d9488}
.tab-pill[data-m="Be"].active{background:#2e1a1a;color:#f87171;border-color:#dc2626}
/* seg tabs */
.tab-pill[data-seg="All"].active{background:#1a1a2e;color:#c4b5fd;border-color:#7c3aed}
.tab-pill[data-seg="NFPU"].active{background:#1a3a1a;color:#4ade80;border-color:#16a34a}
.tab-pill[data-seg="Churn"].active{background:#0a2d14;color:#4ade80;border-color:#16a34a}
.tab-pill[data-seg="Retain"].active{background:#0a1e3a;color:#60a5fa;border-color:#2563eb}
.divider{height:1px;background:var(--border);margin-bottom:14px}
/* Cards */
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:13px 15px}
.card-label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:7px}
.card-value{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:700;color:#f1f5f9}
.card-sub{font-size:11px;color:var(--muted);margin-top:3px}
.delta-badge{display:inline-flex;align-items:center;gap:3px;font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;margin-top:5px}
.delta-up{background:#0a2d14;color:#4ade80}.delta-down{background:#2d0a0a;color:#f87171}.delta-neutral{background:var(--border2);color:var(--muted)}
/* Charts */
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.chart-title{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;font-family:'JetBrains Mono',monospace}
.legend{display:flex;gap:14px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.leg-line{width:18px;height:2px;border-radius:1px}
.leg-dot{width:6px;height:6px;border-radius:50%}
canvas{width:100%!important}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:16px}
/* Table */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:right;padding:0 7px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
thead th:first-child{text-align:center}
tbody td{padding:5px 7px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:10px;color:#94a3b8;border-bottom:1px solid #0c1520}
tbody td:first-child{text-align:center;font-weight:600;color:#64748b}
tbody tr:hover td{background:#0d1e3544}
tbody tr.hl td{background:#0e2235!important}
tbody tr.hl td:first-child{color:var(--june)}
.c-april{color:var(--april)!important}.c-may{color:var(--may)!important}.c-june{color:var(--june)!important}
.c-pos{color:#4ade80!important}.c-neg{color:#f87171!important}
/* Input panel */
.input-panel{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:18px;margin-bottom:16px}
.input-panel-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.input-panel-title{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#60a5fa}
.toggle-btn{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);background:var(--border2);border:none;border-radius:4px;padding:3px 10px;cursor:pointer}
.input-body{display:none;margin-top:16px}
.input-body.open{display:block}
.day-selector-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.day-selector-row label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase}
.day-input{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;width:60px;padding:6px 10px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:#60a5fa;text-align:center}
.day-input:focus{outline:none;border-color:#3b82f6}
.input-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.input-group{display:flex;flex-direction:column;gap:5px}
.input-group label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.seg-label{font-size:10px;font-weight:600;margin-bottom:2px}
.seg-label.nfpu{color:#4ade80}.seg-label.churn{color:#f87171}.seg-label.retain{color:#60a5fa}
.num-input{font-family:'JetBrains Mono',monospace;font-size:12px;padding:7px 11px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);width:100%}
.num-input:focus{outline:none;border-color:#3b82f6;background:#0a1525}
.num-input::placeholder{color:var(--muted2)}
.input-sublabel{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted2);margin-top:1px}
.save-btn{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:9px 26px;background:#1e3a5f;border:1px solid #3b82f6;border-radius:7px;color:#60a5fa;cursor:pointer;transition:all .15s}
.save-btn:hover{background:#2a4f7a;color:#93c5fd}
.save-confirm{font-family:'JetBrains Mono',monospace;font-size:10px;color:#4ade80;margin-left:12px;opacity:0;transition:opacity .3s}
.save-confirm.show{opacity:1}
/* merchant tab indicator stripe */
.merchant-stripe{height:3px;border-radius:2px;margin-bottom:14px;transition:background .2s}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <h1>MBS Daily Segment Tracker</h1>
    <span>June-26</span>
  </div>
  <div class="last-update" id="lastUpdate">Last data: Day 6</div>
</div>

<!-- Merchant tabs -->
<div class="tab-row" id="merchantTabs">
  <button class="tab-pill active" data-m="MBS">All MBS</button>
  <button class="tab-pill" data-m="Grab">Grab</button>
  <button class="tab-pill" data-m="GSM">Xanh SM</button>
  <button class="tab-pill" data-m="Be">Be</button>
</div>

<div class="merchant-stripe" id="merchantStripe"></div>

<!-- Segment tabs -->
<div class="tab-row" id="segTabs">
  <button class="tab-pill" data-seg="All">All</button>
  <button class="tab-pill active" data-seg="NFPU">NFPU (New)</button>
  <button class="tab-pill" data-seg="Churn">Resurrect</button>
  <button class="tab-pill" data-seg="Retain">Retain</button>
</div>

<div class="divider"></div>

<!-- Input panel -->
<div class="input-panel">
  <div class="input-panel-header" onclick="toggleInput()">
    <div class="input-panel-title">📥 Update Daily Data</div>
    <button class="toggle-btn" id="toggleBtn">▼ Open</button>
  </div>
  <div class="input-body" id="inputBody">
    <div class="day-selector-row">
      <label>Day</label>
      <input type="number" class="day-input" id="inputDay" min="1" max="31" value="7"/>
      <span style="font-size:11px;color:var(--muted)">Merchant: <strong id="inputMerchantLabel" style="color:#60a5fa">MBS</strong> — fill cumulative totals for that day</span>
    </div>
    <div class="input-grid">
      <div class="input-group">
        <div class="seg-label nfpu">NFPU</div>
        <label>Cumulative</label>
        <input type="number" class="num-input" id="in_NFPU_cumul" placeholder="e.g. 11500"/>
        <label style="margin-top:6px">Daily Uplift</label>
        <input type="number" class="num-input" id="in_NFPU_uplift" placeholder="auto-calc if blank"/>
        <div class="input-sublabel">Leave blank → auto from cumul diff</div>
      </div>
      <div class="input-group">
        <div class="seg-label churn">Resurrect</div>
        <label>Cumulative</label>
        <input type="number" class="num-input" id="in_Churn_cumul" placeholder="e.g. 57000"/>
        <label style="margin-top:6px">Daily Uplift</label>
        <input type="number" class="num-input" id="in_Churn_uplift" placeholder="auto-calc if blank"/>
      </div>
      <div class="input-group">
        <div class="seg-label retain">Retain</div>
        <label>Cumulative</label>
        <input type="number" class="num-input" id="in_Retain_cumul" placeholder="e.g. 330000"/>
        <label style="margin-top:6px">Daily Uplift</label>
        <input type="number" class="num-input" id="in_Retain_uplift" placeholder="auto-calc if blank"/>
      </div>
    </div>
    <div style="display:flex;align-items:center">
      <button class="save-btn" onclick="saveDay()">Save & Update Charts</button>
      <span class="save-confirm" id="saveConfirm">✓ Updated!</span>
    </div>
  </div>
</div>

<!-- Summary cards -->
<div class="cards-row" id="cards"></div>

<!-- Cumulative chart -->
<div class="chart-wrap">
  <div class="chart-header">
    <div class="chart-title">Cumulative — Daily Pace</div>
    <div class="legend">
      <div class="leg"><div class="leg-line" style="background:var(--april);opacity:.6"></div><span>April</span></div>
      <div class="leg"><div class="leg-line" style="background:var(--may);opacity:.6"></div><span>May</span></div>
      <div class="leg"><div class="leg-line" style="background:var(--june)"></div><span>June</span></div>
    </div>
  </div>
  <canvas id="cumulChart" height="190"></canvas>
</div>

<!-- Daily Uplift chart -->
<div class="chart-wrap">
  <div class="chart-header">
    <div class="chart-title">Daily Uplift</div>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:var(--april);opacity:.5"></div><span>Apr</span></div>
      <div class="leg"><div class="leg-dot" style="background:var(--may);opacity:.5"></div><span>May</span></div>
      <div class="leg"><div class="leg-dot" style="background:var(--june)"></div><span>Jun</span></div>
    </div>
  </div>
  <canvas id="upliftChart" height="190"></canvas>
</div>

<!-- Table -->
<div class="table-wrap">
  <div class="chart-title" style="margin-bottom:12px">Daily Detail</div>
  <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
</div>

const MERCHANT_COLORS = { MBS:'#7c3aed', Grab:'#16a34a', GSM:'#0d9488', Be:'#dc2626' };
const COLORS = { April:'#f59e0b', May:'#3b82f6', June:'#10b981' };
const DAYS = Array.from({length:31},(_,i)=>i+1);

let activeMerchant = 'MBS';
let activeSeg = 'NFPU';
let charts = {};

function getLastDay(merchant, seg) {
  if(seg==='All') {
    return Math.max(...['NFPU','Churn','Retain'].map(s=>getLastDaySeg(merchant,s)));
  }
  const june = ALL_DATA[merchant][seg]?.cumul?.June || [];
  let last = 0;
  june.forEach((v,i) => { if(v!=null) last=i+1; });
  return last;
}

function fmt(n) {
  if(n==null) return '—';
  if(Math.abs(n)>=1000000) return (n/1000000).toFixed(2)+'M';
  if(Math.abs(n)>=1000) return (n/1000).toFixed(1)+'K';
  return Math.round(n).toString();
}

function fmtPct(v) {
  if(v==null) return '—';
  return (v>=0?'+':'')+(v*100).toFixed(1)+'%';
}

function toggleInput() {
  const body = document.getElementById('inputBody');
  const btn = document.getElementById('toggleBtn');
  const isOpen = body.classList.toggle('open');
  btn.textContent = isOpen ? '▲ Close' : '▼ Open';
}

function saveDay() {
  const day = parseInt(document.getElementById('inputDay').value);
  if(!day||day<1||day>31){ alert('Invalid day'); return; }
  const idx = day-1;
  const m = activeMerchant;

  ['NFPU','Churn','Retain'].forEach(seg => {
    if(!ALL_DATA[m][seg]) return;
    const cEl = document.getElementById(`in_${seg}_cumul`);
    const uEl = document.getElementById(`in_${seg}_uplift`);
    const cVal = cEl.value.trim();
    const uVal = uEl.value.trim();

    if(cVal !== '') {
      ALL_DATA[m][seg].cumul.June[idx] = parseFloat(cVal);
    }
    if(uVal !== '') {
      ALL_DATA[m][seg].uplift.June[idx] = parseFloat(uVal);
    } else if(cVal !== '') {
      const prev = idx>0 ? (ALL_DATA[m][seg].cumul.June[idx-1]||0) : 0;
      ALL_DATA[m][seg].uplift.June[idx] = parseFloat(cVal) - prev;
    }
    cEl.value=''; uEl.value='';
  });

  // Recompute avgUplift
  ['NFPU','Churn','Retain'].forEach(seg => {
    if(!ALL_DATA[m][seg]) return;
    const actuals = ALL_DATA[m][seg].uplift.June.filter(v=>v!=null&&v>0);
    ALL_DATA[m][seg].avgUplift.June = actuals.length ? Math.round(actuals.reduce((a,b)=>a+b,0)/actuals.length) : null;
  });

  const conf = document.getElementById('saveConfirm');
  conf.classList.add('show');
  setTimeout(()=>conf.classList.remove('show'),2000);
  renderAll();
}

function renderMerchantStripe() {
  document.getElementById('merchantStripe').style.background = MERCHANT_COLORS[activeMerchant]+'88';
}

function renderCards() {
  const m = activeMerchant, s = activeSeg;
  if(s==='All') { renderCardsAll(m); return; }
  if(!ALL_DATA[m][s]) {
    document.getElementById('cards').innerHTML = '<div style="color:var(--muted);font-family:JetBrains Mono,monospace;font-size:11px;padding:10px">No data for this merchant/segment combination.</div>';
    return;
  }
  const d = ALL_DATA[m][s];
  const lastDay = getLastDay(m, s);
  const jC = d.cumul.June[lastDay-1];
  const mC = d.cumul.May[lastDay-1];
  const aC = d.cumul.April[lastDay-1];
  const gMay = (jC!=null&&mC) ? (jC/mC-1) : null;
  const gApr = (jC!=null&&aC) ? (jC/aC-1) : null;
  const jU = d.uplift.June[lastDay-1];
  const mU = d.uplift.May[lastDay-1];
  const uG = (jU!=null&&mU) ? (jU/mU-1) : null;
  const avgJ = d.avgUplift.June, avgM = d.avgUplift.May;
  const avgG = (avgJ!=null&&avgM) ? (avgJ/avgM-1) : null;

  const cards = [
    {label:`Jun Cumul D${lastDay}`, value:fmt(jC), sub:`May D${lastDay}: ${fmt(mC)}`, delta:gMay, dl:'vs May'},
    {label:`Daily Uplift D${lastDay}`, value:fmt(jU), sub:`May D${lastDay}: ${fmt(mU)}`, delta:uG, dl:'vs May'},
    {label:'Avg Daily Uplift', value:fmt(avgJ), sub:`May avg: ${fmt(avgM)} | Apr: ${fmt(d.avgUplift.April)}`, delta:avgG, dl:'avg MoM'},
  ];

  const el = document.getElementById('cards');
  el.innerHTML = '';
  cards.forEach(c=>{
    const isGood = c.delta!=null?c.delta>=0:null;
    const cls = isGood==null?'delta-neutral':(isGood?'delta-up':'delta-down');
    const arrow = c.delta==null?'':(c.delta>=0?'▲':'▼');
    el.innerHTML += `<div class="card">
      <div class="card-label">${c.label}</div>
      <div class="card-value">${c.value}</div>
      <div class="card-sub">${c.sub}</div>
      <span class="delta-badge ${cls}">${arrow} ${c.delta!=null?fmtPct(c.delta):'—'} ${c.dl}</span>
    </div>`;
  });
}

function makeChart(id, type, labels, datasets, opts={}) {
  if(charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id).getContext('2d');
  charts[id] = new Chart(ctx, {
    type,
    data:{labels,datasets},
    options:{
      responsive:true, maintainAspectRatio:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#0d1e35',borderColor:'#1e3a5f',borderWidth:1,
          titleColor:'#94a3b8',bodyColor:'#e2e8f0',
          titleFont:{family:'JetBrains Mono',size:10},
          bodyFont:{family:'JetBrains Mono',size:11},
          callbacks:{
            label: ctx => {
              if(ctx.raw==null) return null;
              const v=ctx.raw;
              return ` ${ctx.dataset.label}: ${opts.pct?v.toFixed(1)+'%':fmt(v)}`;
            }
          }
        }
      },
      scales:{
        x:{grid:{color:'#0c1520',drawTicks:false},ticks:{color:'#3a5270',font:{family:'JetBrains Mono',size:9}}},
        y:{
          grid:{color:'#0c1520'},
          ticks:{color:'#3a5270',font:{family:'JetBrains Mono',size:9},
            callback: v => opts.pct ? v.toFixed(0)+'%' : (Math.abs(v)>=1000?(v/1000).toFixed(0)+'K':v)
          },
          ...(opts.yScale||{})
        }
      }
    }
  });
}

function renderCharts() {
  const m = activeMerchant, s = activeSeg;
  if(s==='All') { renderChartsAll(m); return; }
  if(!ALL_DATA[m][s]) return;
  const d = ALL_DATA[m][s];
  const labels = DAYS.map(n=>`D${n}`);
  const lastDay = getLastDay(m, s);
  const juneC = d.cumul.June.map((v,i)=>i<lastDay?v:null);
  const juneU = d.uplift.June.map((v,i)=>i<lastDay?v:null);

  makeChart('cumulChart','line',labels,[
    {label:'April',data:d.cumul.April,borderColor:COLORS.April,borderWidth:1.5,pointRadius:0,borderDash:[4,3],tension:.3,spanGaps:false},
    {label:'May',  data:d.cumul.May,  borderColor:COLORS.May,  borderWidth:1.5,pointRadius:0,borderDash:[4,3],tension:.3,spanGaps:false},
    {label:'June', data:juneC,        borderColor:COLORS.June, borderWidth:2.5,
      pointRadius:ctx=>ctx.dataIndex===lastDay-1?5:0, pointBackgroundColor:COLORS.June,
      tension:.3,spanGaps:false, fill:{target:'origin',above:'rgba(16,185,129,0.04)'}},
  ]);

  makeChart('upliftChart','bar',labels,[
    {label:'April',data:d.uplift.April,backgroundColor:COLORS.April+'40',borderColor:COLORS.April+'80',borderWidth:1,borderRadius:2},
    {label:'May',  data:d.uplift.May,  backgroundColor:COLORS.May+'40',  borderColor:COLORS.May+'80',  borderWidth:1,borderRadius:2},
    {label:'June', data:juneU,         backgroundColor:COLORS.June+'88', borderColor:COLORS.June,      borderWidth:1,borderRadius:3},
  ]);

}

function renderTable() {
  const m = activeMerchant, s = activeSeg;
  if(s==='All') { renderTableAll(m); return; }
  document.getElementById('tableHead').innerHTML=`<tr>
    <th>Day</th>
    <th>Apr Cumul</th><th>May Cumul</th><th>Jun Cumul</th>
    <th>Apr Uplift</th><th>May Uplift</th><th>Jun Uplift</th>
    <th>Uplift% vs May</th><th>Uplift% vs Apr</th>
  </tr>`;
  const body = document.getElementById('tableBody');
  body.innerHTML='';
  if(!ALL_DATA[m][s]) return;
  const d = ALL_DATA[m][s];
  const lastDay = getLastDay(m,s);
  const maxDay = Math.max(
    d.cumul.April.filter(v=>v!=null).length,
    d.cumul.May.filter(v=>v!=null).length,
    lastDay
  );
  for(let i=0;i<maxDay;i++){
    const aC=d.cumul.April[i],mC=d.cumul.May[i],jC=i<lastDay?d.cumul.June[i]:null;
    const aU=d.uplift.April[i],mU=d.uplift.May[i],jU=i<lastDay?d.uplift.June[i]:null;
    const uVsMay=(jU!=null&&mU&&mU!==0)?(jU/mU-1):null;
    const uVsApr=(jU!=null&&aU&&aU!==0)?(jU/aU-1):null;
    const tr=document.createElement('tr');
    if(i===lastDay-1) tr.className='hl';
    tr.innerHTML=`
      <td>${i+1}${i===lastDay-1?' ●':''}</td>
      <td style="color:#4a5e78">${aC!=null?fmt(aC):'—'}</td>
      <td style="color:#4a5e78">${mC!=null?fmt(mC):'—'}</td>
      <td style="color:#e2e8f0">${jC!=null?fmt(jC):'—'}</td>
      <td style="color:#4a5e78">${aU!=null?fmt(aU):'—'}</td>
      <td style="color:#4a5e78">${mU!=null?fmt(mU):'—'}</td>
      <td style="color:#e2e8f0">${jU!=null?fmt(jU):'—'}</td>
      <td class="${uVsMay==null?'':(uVsMay>=0?'c-pos':'c-neg')}">${uVsMay!=null?fmtPct(uVsMay):'—'}</td>
      <td class="${uVsApr==null?'':(uVsApr>=0?'c-pos':'c-neg')}">${uVsApr!=null?fmtPct(uVsApr):'—'}</td>
    `;
    body.appendChild(tr);
  }
}


function getLastDaySeg(m, seg) {
  if(!ALL_DATA[m][seg]) return 0;
  const june = ALL_DATA[m][seg].cumul.June;
  let last=0; june.forEach((v,i)=>{if(v!=null)last=i+1;}); return last;
}

      <div class="card-label">${labels[si]}</div>
      <div class="card-value">${fmt(jC)}</div>
      <div class="card-sub">May D${lastDay}: ${fmt(mC)} | Uplift: ${fmt(jU)}</div>
      <span class="delta-badge ${cls}">${arrow} ${gMay!=null?fmtPct(gMay):'—'} vs May</span>
    </div>`;
  });
}

function renderChartsAll(m) {
  const labels = DAYS.map(n=>`D${n}`);
  const segDefs = [
    {key:'NFPU', label:'NFPU (New)', color:'#4ade80'},
    {key:'Churn', label:'Resurrect', color:'#60a5fa'},
    {key:'Retain', label:'Retain', color:'#a78bfa'},
  ];
  // Cumulative chart - 3 lines for June only, with May dashed
  // Compute MPU total (sum of 3 segments) per day
  const mpuMay = Array(31).fill(null);
  const mpuJune = Array(31).fill(null);
  const mpuLastDay = Math.max(...segDefs.map(sd=>getLastDaySeg(m,sd.key)));
  segDefs.forEach(sd=>{
    if(!ALL_DATA[m][sd.key]) return;
    const d=ALL_DATA[m][sd.key];
    d.cumul.May.forEach((v,i)=>{ if(v!=null) mpuMay[i]=(mpuMay[i]||0)+v; });
    d.cumul.June.forEach((v,i)=>{ if(v!=null) mpuJune[i]=(mpuJune[i]||0)+v; });
  });

  const datasets = [];
  // MPU total line first (prominent)
  datasets.push({
    label:'MPU Total May', data:mpuMay, borderColor:'#ffffff',
    borderWidth:1.2, pointRadius:0, borderDash:[4,3], tension:.3, spanGaps:false
  });
  datasets.push({
    label:'MPU Total', data:mpuJune.map((v,i)=>i<mpuLastDay?v:null),
    borderColor:'#ffffff', borderWidth:3,
    pointRadius:ctx=>ctx.dataIndex===mpuLastDay-1?5:0,
    pointBackgroundColor:'#ffffff', tension:.3, spanGaps:false,
  });
  segDefs.forEach(sd=>{
    if(!ALL_DATA[m][sd.key]) return;
    const d=ALL_DATA[m][sd.key];
    const lastDay=getLastDaySeg(m,sd.key);
    datasets.push({
      label:sd.label+' May', data:d.cumul.May, borderColor:sd.color,
      borderWidth:1, pointRadius:0, borderDash:[4,3], tension:.3, spanGaps:false
    });
    datasets.push({
      label:sd.label, data:d.cumul.June.map((v,i)=>i<lastDay?v:null),
      borderColor:sd.color, borderWidth:2,
      pointRadius:ctx=>ctx.dataIndex===lastDay-1?4:0,
      pointBackgroundColor:sd.color, tension:.3, spanGaps:false,
    });
  });
  if(charts['cumulChart']) charts['cumulChart'].destroy();
  const ctx=document.getElementById('cumulChart').getContext('2d');
  charts['cumulChart']=new Chart(ctx,{
    type:'line', data:{labels,datasets},
    options:{
      responsive:true, maintainAspectRatio:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:true, labels:{color:'#64748b',font:{family:'JetBrains Mono',size:9},boxWidth:12,padding:12}},
        tooltip:{backgroundColor:'#0d1e35',borderColor:'#1e3a5f',borderWidth:1,
          titleColor:'#94a3b8',bodyColor:'#e2e8f0',
          titleFont:{family:'JetBrains Mono',size:10},bodyFont:{family:'JetBrains Mono',size:11},
          callbacks:{label:ctx=>{if(ctx.raw==null)return null; return ` ${ctx.dataset.label}: ${fmt(ctx.raw)}`;}}
        }
      },
      scales:{
        x:{grid:{color:'#0c1520',drawTicks:false},ticks:{color:'#3a5270',font:{family:'JetBrains Mono',size:9}}},
        y:{grid:{color:'#0c1520'},ticks:{color:'#3a5270',font:{family:'JetBrains Mono',size:9},callback:v=>Math.abs(v)>=1000?(v/1000).toFixed(0)+'K':v}}
      }
    }
  });
  // Uplift chart
  const upDatasets=[];
  segDefs.forEach(sd=>{
    if(!ALL_DATA[m][sd.key]) return;
    const d=ALL_DATA[m][sd.key];
    const lastDay=getLastDaySeg(m,sd.key);
    upDatasets.push({
      label:sd.label, data:d.uplift.June.map((v,i)=>i<lastDay?v:null),
      backgroundColor:sd.color+'88', borderColor:sd.color, borderWidth:1, borderRadius:3, type:'bar'
    });
  });
  if(charts['upliftChart']) charts['upliftChart'].destroy();
  const ctx2=document.getElementById('upliftChart').getContext('2d');
  charts['upliftChart']=new Chart(ctx2,{
    type:'bar', data:{labels,datasets:upDatasets},
    options:{
      responsive:true,maintainAspectRatio:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:true,labels:{color:'#64748b',font:{family:'JetBrains Mono',size:9},boxWidth:12,padding:10}},
        tooltip:{backgroundColor:'#0d1e35',borderColor:'#1e3a5f',borderWidth:1,
          titleColor:'#94a3b8',bodyColor:'#e2e8f0',
          titleFont:{family:'JetBrains Mono',size:10},bodyFont:{family:'JetBrains Mono',size:11},
          callbacks:{label:ctx=>{if(ctx.raw==null)return null; return ` ${ctx.dataset.label}: ${fmt(ctx.raw)}`;}}
        }
      },
      scales:{
        x:{grid:{color:'#0c1520',drawTicks:false},ticks:{color:'#3a5270',font:{family:'JetBrains Mono',size:9}}},
        y:{grid:{color:'#0c1520'},ticks:{color:'#3a5270',font:{family:'JetBrains Mono',size:9},callback:v=>Math.abs(v)>=1000?(v/1000).toFixed(0)+'K':v}}
      }
    }
  });
}

function renderTableAll(m) {
  const segs = [{key:'NFPU',label:'NFPU',color:'#4ade80'},{key:'Churn',label:'Resurrect',color:'#60a5fa'},{key:'Retain',label:'Retain',color:'#a78bfa'}];
  document.getElementById('tableHead').innerHTML=`<tr>
    <th>Day</th>
    <th style="color:#fff">MPU Jun</th><th style="color:#fff">MPU May</th><th style="color:#fff">MPU%</th>
    ${segs.map(s=>`<th style="color:${s.color}">${s.label} Jun</th><th style="color:${s.color}">${s.label} May</th><th style="color:${s.color}">%</th><th style="color:${s.color}">Uplift Jun</th><th style="color:${s.color}">Uplift May</th>`).join('')}
  </tr>`;
  const body=document.getElementById('tableBody');
  body.innerHTML='';
  const maxDay=Math.max(...segs.map(s=>getLastDaySeg(m,s.key)));
  for(let i=0;i<maxDay;i++){
    const tr=document.createElement('tr');
    let isLast=false;
    // MPU total
    let mpuJ=0, mpuM=0, mpuJvalid=false;
    segs.forEach(s=>{
      if(!ALL_DATA[m][s.key]) return;
      const d=ALL_DATA[m][s.key];
      const lastDay=getLastDaySeg(m,s.key);
      const jC=i<lastDay?d.cumul.June[i]:null;
      const mC=d.cumul.May[i];
      if(jC!=null){mpuJ+=jC;mpuJvalid=true;}
      if(mC!=null) mpuM+=mC;
    });
    const mpuG=(mpuJvalid&&mpuM)?(mpuJ/mpuM-1):null;
    let cells=`<td>${i+1}</td>`;
    cells+=`<td style="color:#ffffff">${mpuJvalid?fmt(mpuJ):'—'}</td>`;
    cells+=`<td style="color:#4a5e78">${mpuM?fmt(mpuM):'—'}</td>`;
    cells+=`<td class="${mpuG==null?'':(mpuG>=0?'c-pos':'c-neg')}">${mpuG!=null?fmtPct(mpuG):'—'}</td>`;
    segs.forEach(s=>{
      if(!ALL_DATA[m][s.key]){cells+=`<td>—</td><td>—</td><td>—</td>`;return;}
      const d=ALL_DATA[m][s.key];
      const lastDay=getLastDaySeg(m,s.key);
      if(i===lastDay-1) isLast=true;
      const jC=i<lastDay?d.cumul.June[i]:null;
      const mC=d.cumul.May[i];
      const g=(jC!=null&&mC)?(jC/mC-1):null;
      const jU2=i<lastDay?d.uplift.June[i]:null;
      const mU2=d.uplift.May[i];
      cells+=`<td style="color:#e2e8f0">${jC!=null?fmt(jC):'—'}</td>`;
      cells+=`<td style="color:#4a5e78">${mC!=null?fmt(mC):'—'}</td>`;
      cells+=`<td class="${g==null?'':(g>=0?'c-pos':'c-neg')}">${g!=null?fmtPct(g):'—'}</td>`;
      cells+=`<td style="color:#e2e8f0">${jU2!=null?fmt(jU2):'—'}</td>`;
      cells+=`<td style="color:#4a5e78">${mU2!=null?fmt(mU2):'—'}</td>`;
    });
    tr.innerHTML=cells;
    if(isLast) tr.className='hl';
    body.appendChild(tr);
  }
}

function renderAll() {
  const lastDay = getLastDay(activeMerchant, activeSeg);
  document.getElementById('lastUpdate').textContent = `Last data: Day ${lastDay} (June) — ${activeMerchant}`;
  document.getElementById('inputMerchantLabel').textContent = activeMerchant;
  document.getElementById('inputDay').value = lastDay;
  renderMerchantStripe();
  renderCards();
  renderCharts();
  renderTable();
}

// Merchant tabs
document.querySelectorAll('[data-m]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-m]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeMerchant=btn.dataset.m;
    renderAll();
  });
});

// Seg tabs
document.querySelectorAll('[data-seg]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-seg]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeSeg=btn.dataset.seg;
    renderAll();
  });
});

const s=document.createElement('script');
s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
s.onload=()=>renderAll();
document.head.appendChild(s);
</script>
